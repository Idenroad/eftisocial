{% extends "base.html" %}
{% block title %}{{ t("Votre code") }} — EftiSocial{% endblock %}
{% block content %}
<div class="center-box">
  <h1>{{ t("Votre code") }}</h1>
  <p>{{ t("Un code a été envoyé à") }} <strong>{{ email }}</strong> {{ t("si ce compte existe.") }}</p>
  {% if error %}<p class="alert-rouge">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="code" class="champ champ-code" placeholder="123456"
           inputmode="numeric" pattern="[0-9]{3,6}" maxlength="6"
           autocomplete="one-time-code" required autofocus>
    <label class="case">
      <input type="checkbox" name="remember" value="1">
      {{ t("Rester connecté sur cet appareil") }}
    </label>
    <button type="submit" class="btn btn-vert btn-plein">{{ t("Me connecter") }}</button>
  </form>
</div>
{% endblock %}
